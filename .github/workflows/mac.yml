name: "MacOS CI Pipeline"

# fork 定制：只保留 macOS x86_64 Release 构建（产出 libonnxruntime dylib）
on:
  push:
    branches:
      - main
      - rel-*
  pull_request:
    branches:
      - main
      - rel-*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  python_version: "3.14"

jobs:
  osx_x64:
    uses: ./.github/workflows/macos-ci-build-and-test-workflow.yml
    with:
      # macos-15-intel = x86_64 runner；Xcode 16.4 是该镜像的默认版本
      matrix_include: >-
        [
          {"machine": "x86_64", "target": "x86_64", "build_config": "Release", "xcode_version": "16.4"}
        ]
      python_version: "3.14"
